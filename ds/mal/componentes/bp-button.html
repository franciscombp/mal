<!-- ══════════════════════════════════════════════════════════════
     bp-button · Botón de acción principal y secundaria

     Uso:
       <button class="bp-button" data-variant="primary">Aceptar</button>
       <button class="bp-button" data-variant="secondary">Cancelar</button>
       <button class="bp-button" data-variant="tertiary">Más info</button>
       <button class="bp-button" data-variant="accent">Especial</button>
       <button class="bp-button" data-variant="destructive">Eliminar</button>

     Variantes (data-variant):
       - primary (defecto): CTA principal - amarillo
       - secondary: Acción secundaria - gris
       - tertiary: Link estilizado - subrayado
       - accent: Acción destacada - azul oscuro
       - destructive: Acción destructiva - rojo

     Estados (se aplican automáticamente con CSS):
       - default: estado normal
       - hover: al pasar el mouse
       - focus: al estar enfocado
       - pressed/active: al pulsar
       - disabled: deshabilitado
       - loading: cargando (muestra spinner)

     Atributos:
       data-variant: tipo de botón (primary|secondary|tertiary|accent|destructive)
       data-state: fuerza un estado específico (para demostración)
       data-has-icon: muestra un ícono (próximamente)
       disabled: deshabilita el botón
       aria-busy: estado de carga accesible

     Estructura HTML esperada:
       <button class="bp-button" data-variant="primary">
         <span class="bp-button__label">Etiqueta</span>
       </button>

   ══════════════════════════════════════════════════════════════ -->

<style>
  :root {
    /* Colores base */
    --bp-color-primary-bg: #fd0;
    --bp-color-primary-bg-hover: #ffcb00;
    --bp-color-primary-bg-pressed: #ffb705;
    --bp-color-primary-bg-disabled: #fff3cd;
    --bp-color-primary-fg: #0f265c;
    --bp-color-primary-fg-disabled: #0f265c;

    --bp-color-secondary-bg: #f5f5f5;
    --bp-color-secondary-bg-hover: #ececec;
    --bp-color-secondary-bg-pressed: #e0e0e0;
    --bp-color-secondary-bg-disabled: #fafafa;
    --bp-color-secondary-fg: #0f265c;
    --bp-color-secondary-fg-disabled: #0f265c;

    --bp-color-tertiary-bg: transparent;
    --bp-color-tertiary-bg-hover: #fafafa;
    --bp-color-tertiary-bg-pressed: #f5f5f5;
    --bp-color-tertiary-bg-disabled: white;
    --bp-color-tertiary-fg: #0f265c;
    --bp-color-tertiary-fg-disabled: #0f265c;

    --bp-color-accent-bg: #030c2d;
    --bp-color-accent-bg-hover: #061239;
    --bp-color-accent-bg-pressed: #091944;
    --bp-color-accent-bg-disabled: #cfd4de;
    --bp-color-accent-fg: white;
    --bp-color-accent-fg-disabled: white;

    --bp-color-destructive-bg: #fceded;
    --bp-color-destructive-bg-hover: #d50707;
    --bp-color-destructive-bg-pressed: #d50707;
    --bp-color-destructive-bg-disabled: #d50707;
    --bp-color-destructive-fg: #980101;
    --bp-color-destructive-fg-disabled: #d50707;

    --bp-color-focus-ring: #2f7abf;
    --bp-color-white: white;

    /* Tamaños */
    --bp-button-height: 56px;
    --bp-button-padding-x: 24px;
    --bp-button-gap: 4px;
    --bp-button-radius: 8px;
    --bp-button-icon-size: 24px;

    /* Tipografía */
    --bp-button-font-size: 16px;
    --bp-button-font-weight: 600;
    --bp-button-line-height: 20px;
    --bp-button-letter-spacing: 0;
  }

  .bp-button {
    /* Layout */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--bp-button-gap);
    min-height: var(--bp-button-height);
    padding: 0 var(--bp-button-padding-x);
    border-radius: var(--bp-button-radius);

    /* Tipografía */
    font-size: var(--bp-button-font-size);
    font-weight: var(--bp-button-font-weight);
    line-height: var(--bp-button-line-height);
    letter-spacing: var(--bp-button-letter-spacing);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    /* Bordes */
    border: 1px solid transparent;

    /* Interacción */
    cursor: pointer;
    transition: all 150ms ease-in-out;
    position: relative;

    /* Reset */
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;

    /* Asegura que funcione en iOS */
    -webkit-touch-callout: none;
    user-select: none;
  }

  /* ─── Variante PRIMARY (amarillo) ─────────────────────────────── */
  .bp-button[data-variant="primary"],
  .bp-button:not([data-variant]) {
    background-color: var(--bp-color-primary-bg);
    color: var(--bp-color-primary-fg);
  }

  .bp-button[data-variant="primary"]:hover:not(:disabled),
  .bp-button:not([data-variant]):hover:not(:disabled) {
    background-color: var(--bp-color-primary-bg-hover);
  }

  .bp-button[data-variant="primary"]:active:not(:disabled),
  .bp-button:not([data-variant]):active:not(:disabled),
  .bp-button[data-variant="primary"][data-state="pressed"],
  .bp-button:not([data-variant])[data-state="pressed"] {
    background-color: var(--bp-color-primary-bg-pressed);
  }

  .bp-button[data-variant="primary"]:focus-visible:not(:disabled),
  .bp-button:not([data-variant]):focus-visible:not(:disabled) {
    outline: none;
    box-shadow:
      0 0 0 2px var(--bp-color-white),
      0 0 0 4px var(--bp-color-focus-ring);
    background-color: var(--bp-color-primary-bg);
  }

  .bp-button[data-variant="primary"]:disabled,
  .bp-button:not([data-variant]):disabled {
    background-color: var(--bp-color-primary-bg-disabled);
    color: var(--bp-color-primary-fg-disabled);
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ─── Variante SECONDARY (gris) ────────────────────────────────── */
  .bp-button[data-variant="secondary"] {
    background-color: var(--bp-color-secondary-bg);
    color: var(--bp-color-secondary-fg);
  }

  .bp-button[data-variant="secondary"]:hover:not(:disabled) {
    background-color: var(--bp-color-secondary-bg-hover);
  }

  .bp-button[data-variant="secondary"]:active:not(:disabled),
  .bp-button[data-variant="secondary"][data-state="pressed"] {
    background-color: var(--bp-color-secondary-bg-pressed);
  }

  .bp-button[data-variant="secondary"]:focus-visible:not(:disabled) {
    outline: none;
    box-shadow:
      0 0 0 2px var(--bp-color-white),
      0 0 0 4px var(--bp-color-focus-ring);
    background-color: var(--bp-color-secondary-bg);
  }

  .bp-button[data-variant="secondary"]:disabled {
    background-color: var(--bp-color-secondary-bg-disabled);
    color: var(--bp-color-secondary-fg-disabled);
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ─── Variante TERTIARY (link con subrayado) ──────────────────── */
  .bp-button[data-variant="tertiary"] {
    background-color: var(--bp-color-tertiary-bg);
    color: var(--bp-color-tertiary-fg);
    text-decoration: underline;
    text-decoration-color: currentColor;
    text-underline-offset: 4px;
  }

  .bp-button[data-variant="tertiary"]:hover:not(:disabled) {
    background-color: var(--bp-color-tertiary-bg-hover);
  }

  .bp-button[data-variant="tertiary"]:active:not(:disabled),
  .bp-button[data-variant="tertiary"][data-state="pressed"] {
    background-color: var(--bp-color-tertiary-bg-pressed);
  }

  .bp-button[data-variant="tertiary"]:focus-visible:not(:disabled) {
    outline: none;
    box-shadow:
      0 0 0 2px var(--bp-color-white),
      0 0 0 4px var(--bp-color-focus-ring);
    background-color: var(--bp-color-tertiary-bg-hover);
  }

  .bp-button[data-variant="tertiary"]:disabled {
    background-color: var(--bp-color-tertiary-bg-disabled);
    color: var(--bp-color-tertiary-fg-disabled);
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ─── Variante ACCENT (azul oscuro) ────────────────────────────── */
  .bp-button[data-variant="accent"] {
    background-color: var(--bp-color-accent-bg);
    color: var(--bp-color-accent-fg);
  }

  .bp-button[data-variant="accent"]:hover:not(:disabled) {
    background-color: var(--bp-color-accent-bg-hover);
  }

  .bp-button[data-variant="accent"]:active:not(:disabled),
  .bp-button[data-variant="accent"][data-state="pressed"] {
    background-color: var(--bp-color-accent-bg-pressed);
  }

  .bp-button[data-variant="accent"]:focus-visible:not(:disabled) {
    outline: none;
    box-shadow:
      0 0 0 2px var(--bp-color-white),
      0 0 0 4px var(--bp-color-focus-ring);
    background-color: var(--bp-color-accent-bg);
  }

  .bp-button[data-variant="accent"]:disabled {
    background-color: var(--bp-color-accent-bg-disabled);
    color: var(--bp-color-accent-fg-disabled);
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ─── Variante DESTRUCTIVE (rojo) ─────────────────────────────── */
  .bp-button[data-variant="destructive"] {
    background-color: var(--bp-color-destructive-bg);
    color: var(--bp-color-destructive-fg);
  }

  .bp-button[data-variant="destructive"]:hover:not(:disabled) {
    background-color: var(--bp-color-destructive-bg-hover);
    color: white;
  }

  .bp-button[data-variant="destructive"]:active:not(:disabled),
  .bp-button[data-variant="destructive"][data-state="pressed"] {
    background-color: var(--bp-color-destructive-bg-pressed);
    color: white;
  }

  .bp-button[data-variant="destructive"]:focus-visible:not(:disabled) {
    outline: none;
    box-shadow:
      0 0 0 2px var(--bp-color-white),
      0 0 0 4px var(--bp-color-focus-ring);
    background-color: var(--bp-color-destructive-bg);
  }

  .bp-button[data-variant="destructive"]:disabled {
    background-color: var(--bp-color-destructive-bg-disabled);
    color: var(--bp-color-destructive-fg-disabled);
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ─── Estado de carga (loading) ───────────────────────────────── */
  .bp-button[aria-busy="true"] {
    position: relative;
    color: transparent;
  }

  .bp-button[aria-busy="true"]::after {
    content: '';
    position: absolute;
    inset: 50%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    border: 2px solid;
    border-radius: 50%;
    border-top-color: currentColor;
    border-right-color: currentColor;
    border-bottom-color: transparent;
    border-left-color: transparent;
    animation: bp-spinner-spin 0.8s linear infinite;
  }

  /* Spinner con menos movimiento si se prefiere */
  @media (prefers-reduced-motion: reduce) {
    .bp-button[aria-busy="true"]::after {
      animation: none;
      border-top-color: transparent;
      border-right-color: currentColor;
    }
  }

  @keyframes bp-spinner-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ─── Ícono dentro del botón ──────────────────────────────────── */
  .bp-button__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: var(--bp-button-icon-size);
    height: var(--bp-button-icon-size);
  }

  /* SVG dentro del ícono */
  .bp-button__icon svg,
  .bp-button__icon img {
    width: 100%;
    height: 100%;
  }

  /* ─── Etiqueta del botón ──────────────────────────────────────── */
  .bp-button__label {
    display: inline;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ─── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .bp-button {
      --bp-button-padding-x: 16px;
      font-size: 14px;
      min-height: 44px;
    }
  }
</style>

<button class="bp-button" data-variant="primary">
  <span class="bp-button__label">Primary</span>
</button>

<button class="bp-button" data-variant="secondary">
  <span class="bp-button__label">Secondary</span>
</button>

<button class="bp-button" data-variant="tertiary">
  <span class="bp-button__label">Tertiary</span>
</button>

<button class="bp-button" data-variant="accent">
  <span class="bp-button__label">Accent</span>
</button>

<button class="bp-button" data-variant="destructive">
  <span class="bp-button__label">Destructive</span>
</button>

<hr style="margin: 2rem 0;">

<h3>Estados</h3>

<button class="bp-button" data-variant="primary" data-state="hover">
  <span class="bp-button__label">Hover</span>
</button>

<button class="bp-button" data-variant="primary" data-state="focus">
  <span class="bp-button__label">Focus</span>
</button>

<button class="bp-button" data-variant="primary" data-state="pressed">
  <span class="bp-button__label">Pressed</span>
</button>

<button class="bp-button" data-variant="primary" disabled>
  <span class="bp-button__label">Disabled</span>
</button>

<button class="bp-button" data-variant="primary" aria-busy="true">
  <span class="bp-button__label">Loading</span>
</button>

<hr style="margin: 2rem 0;">

<h3>Con ícono</h3>

<button class="bp-button" data-variant="primary">
  <svg class="bp-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 5v14M5 12h14"/>
  </svg>
  <span class="bp-button__label">Con ícono</span>
</button>
