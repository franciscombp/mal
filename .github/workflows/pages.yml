# Publica el repo en GitHub Pages en cada push a main.
#
# Hace lo mismo que el despliegue automático de Pages, más dos cosas:
#   1. Sella cada .css y .js del sitio con el commit (.github/sella.py), para
#      que cada publicación estrene URLs y nadie tenga que borrar la caché.
#   2. No cancela un despliegue cuando llega otro: los encola. El automático
#      sí cancelaba, y dos merges seguidos dejaban el primero sin publicar.
#
# Requiere en Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Publicar en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sellar el CSS y el JS con el commit
        run: python3 .github/sella.py "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
