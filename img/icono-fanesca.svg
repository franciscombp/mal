<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- La fanesca: el choclo a medio deshojar, de pie, como en el
       nivel. Todo dentro de la zona segura maskable (80% central). -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#5f97d8"/>
      <stop offset="62%" stop-color="#1b5faa"/>
      <stop offset="100%" stop-color="#123f74"/>
    </radialGradient>
    <linearGradient id="mazorca" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc93c"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8cc63f"/>
      <stop offset="100%" stop-color="#4c7c1f"/>
    </linearGradient>
    <clipPath id="cuerpo">
      <ellipse cx="256" cy="240" rx="86" ry="140"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#fondo)"/>
  <g fill="#a9c9ec" opacity=".28">
    <path d="M116 116 l14 -22 14 22 -14 22 Z"/>
    <path d="M396 116 l14 -22 14 22 -14 22 Z"/>
  </g>

  <!-- la sombra -->
  <ellipse cx="256" cy="424" rx="140" ry="24" fill="#0c2c50" opacity=".45"/>

  <!-- los pelos, asomando arriba -->
  <g fill="none" stroke="#e8a469" stroke-width="10" stroke-linecap="round">
    <path d="M236 112 q-6 -26 8 -40"/>
    <path d="M258 106 q2 -26 -4 -44"/>
    <path d="M278 112 q10 -24 0 -42"/>
  </g>

  <!-- las hojas abiertas hacia abajo: ya vamos a medio deshojar -->
  <path d="M196 220 q-64 60 -48 150 q44 18 74 -28 q-20 -60 -8 -116 Z" fill="url(#hoja)"/>
  <path d="M316 220 q64 60 48 150 q-44 18 -74 -28 q20 -60 8 -116 Z" fill="url(#hoja)"/>
  <path d="M232 260 q-30 78 -6 150 q34 10 48 -20 q-22 -62 -14 -126 Z" fill="#6fae2e"/>

  <!-- la mazorca -->
  <ellipse cx="256" cy="240" rx="86" ry="140" fill="url(#mazorca)"/>
  <!-- la rejilla de granos, la firma del nivel -->
  <g clip-path="url(#cuerpo)" fill="#c07610" opacity=".5">
    <circle cx="200" cy="140" r="9"/><circle cx="240" cy="132" r="9"/><circle cx="280" cy="136" r="9"/><circle cx="314" cy="150" r="9"/>
    <circle cx="188" cy="180" r="9"/><circle cx="228" cy="172" r="9"/><circle cx="268" cy="172" r="9"/><circle cx="306" cy="182" r="9"/>
    <circle cx="180" cy="222" r="9"/><circle cx="220" cy="214" r="9"/><circle cx="262" cy="212" r="9"/><circle cx="302" cy="220" r="9"/>
    <circle cx="182" cy="264" r="9"/><circle cx="222" cy="256" r="9"/><circle cx="264" cy="254" r="9"/><circle cx="304" cy="262" r="9"/>
    <circle cx="190" cy="306" r="9"/><circle cx="230" cy="298" r="9"/><circle cx="270" cy="298" r="9"/><circle cx="308" cy="304" r="9"/>
    <circle cx="204" cy="346" r="9"/><circle cx="244" cy="340" r="9"/><circle cx="282" cy="342" r="9"/>
  </g>
  <!-- un hueco: por aquí ya pasó el pulgar -->
  <ellipse cx="318" cy="196" rx="16" ry="22" fill="#c07610" opacity=".85"/>
  <ellipse cx="318" cy="192" rx="12" ry="16" fill="#f3f1ec"/>

  <!-- la carita del choclo -->
  <circle cx="226" cy="228" r="11" fill="#2b2129"/>
  <circle cx="282" cy="228" r="11" fill="#2b2129"/>
  <circle cx="230" cy="224" r="4" fill="#ffffff"/>
  <circle cx="286" cy="224" r="4" fill="#ffffff"/>
  <path d="M232 256 q24 20 48 0" fill="none" stroke="#2b2129" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="250" r="11" fill="#ff77ab" opacity=".5"/>
  <circle cx="310" cy="250" r="11" fill="#ff77ab" opacity=".5"/>

  <!-- el gusanito, espiando desde una hoja: la regla de la casa -->
  <g transform="translate(348 352)">
    <circle cx="0" cy="0" r="15" fill="#e01b6a"/>
    <circle cx="22" cy="-6" r="12" fill="#ff77ab"/>
    <circle cx="26" cy="-9" r="3.4" fill="#2b2129"/>
    <circle cx="19" cy="-9" r="3.4" fill="#2b2129"/>
  </g>
</svg>
